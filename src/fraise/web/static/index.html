<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f7">
    <title>Fraise · Model workbench</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%23bd6148' d='M24 43C14 35 5 25 9 16c3-8 11-7 15-3 4-4 12-5 15 3 4 9-5 19-15 27Z'/%3E%3Cpath stroke='%235a6a46' stroke-width='4' fill='none' d='M24 13V4m0 9L14 7m10 6 10-6'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/styles.css">
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <button class="sidebar-shade" id="sidebar-shade" aria-label="Close navigation" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#autocomplete" aria-label="Fraise home">Fraise<span class="local-tag">local</span></a>
      <button class="sidebar-action" id="new-input">New input</button>
      <nav class="navigation" aria-label="Workspace">
        <button class="nav-item active" data-view="autocomplete">Autocomplete</button>
        <button class="nav-item" data-view="compare">Compare</button>
        <button class="nav-item" data-view="train">Train</button>
        <button class="nav-item" data-view="tokens">Tokenization</button>
      </nav>
      <div class="history-heading"><span>Saved inputs</span><button id="clear-history" class="icon-button" aria-label="Clear saved inputs" title="Clear saved inputs">Clear</button></div>
      <div class="history-list" id="history-list"><p class="sidebar-empty">No saved inputs.</p></div>
      <div class="sidebar-bottom"><span class="status-dot" id="device-dot"></span><div><span id="device-label">Connecting to your workspace</span><small>Runs stay on this machine</small></div></div>
    </aside>
    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-button mobile-menu" id="menu-toggle" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button><span id="view-label">Autocomplete</span><span class="topbar-divider">/</span><span class="topbar-subtitle" id="view-subtitle">Base language model evaluation</span></div>
        <div class="global-status" id="global-status" role="status"><span class="status-dot"></span><span>Local workspace</span></div>
      </header>
      <div id="connection-error" class="connection-error" role="alert" hidden></div>
      <section class="view workspace-view autocomplete-view" id="autocomplete-view" aria-label="Autocomplete"></section>
      <section class="view workspace-view" id="compare-view" aria-label="Compare checkpoints" hidden></section>
      <section class="view workspace-view" id="train-view" aria-label="Train a model" hidden></section>
      <section class="view workspace-view" id="tokens-view" aria-label="Tokenization and hierarchy" hidden></section>
      <noscript><p class="notice">Fraise needs JavaScript to connect to your local models.</p></noscript>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
