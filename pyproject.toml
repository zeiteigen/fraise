[project]
name = "fraise"
version = "0.1.0"
description = "Hierarchical tokenizer for LLMs experiment"
readme = "README.md"
authors = [
    { name = "Shahzad", email = "code@alishahzad.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.32.0",
    "tokenizers>=0.23.2",
]

[project.scripts]
create-tokenizer = "scripts.create_tokenizer:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scripts"
