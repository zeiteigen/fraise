[project]
name = "fraise"
version = "0.1.0"
description = "Hierarchical tokenizer for LLMs experiment"
readme = "README.md"
authors = [
    { name = "Shahzad", email = "code@alishahzad.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "filelock>=3.0",
    "huggingface-hub>=1.32.0",
    "tokenizers>=0.23.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.optional-dependencies]
npu = ["openvino>=2026.4"]
notebooks = ["ipykernel>=7.3.0", "ipython>=9.17.1"]

[project.scripts]
create-tokenizer = "fraise.cli.create_tokenizer:main"
train = "fraise.cli.train:main"
visualize-training-data = "fraise.cli.visualize_training_data:main"
params = "fraise.cli.calculate_params:main"
checkpoint-to-model = "fraise.cli.checkpoint_to_model:main"
migrate-run = "fraise.cli.migrate_run:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fraise"
